# Зеркало на GitFlic: main и метки выпусков уходят в репозиторий на gitflic.ru после каждой
# отправки в main и после процесса «Выпуск» — метку он ставит токеном GitHub, а такие метки
# другие процессы не запускают. Настройки репозитория GitHub: переменная GITFLIC_REPO — путь проекта
# (владелец/проект), секреты GITFLIC_LOGIN и GITFLIC_TOKEN — логин и токен доступа GitFlic
# (токену нужны права на запись в репозиторий и на релизы). Без них процесс пропускается.
# Затем выпуск текущей версии публикуется и на GitFlic: релиз на метке v<версия> со сборкой
# .xlib, взятой из выпуска на GitHub, и описанием из CHANGELOG.md. После процесса «Выпуск»
# сборка релиза на GitFlic перезаливается, как и на GitHub
name: Зеркало

on:
  push:
    branches:
      - main
  workflow_run:
    workflows:
      - Выпуск
    types:
      - completed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Проверить настройки
        env:
          REPO: ${{ vars.GITFLIC_REPO }}
          LOGIN: ${{ secrets.GITFLIC_LOGIN }}
          TOKEN: ${{ secrets.GITFLIC_TOKEN }}
        run: |
          if [ -z "$REPO" ] || [ -z "$LOGIN" ] || [ -z "$TOKEN" ]; then
            echo "Зеркало не настроено: нужны GITFLIC_REPO, GITFLIC_LOGIN и GITFLIC_TOKEN"
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi
      - uses: actions/checkout@v4
        if: env.SKIP != '1'
        with:
          fetch-depth: 0
      - name: Отправить на GitFlic
        if: env.SKIP != '1'
        env:
          REPO: ${{ vars.GITFLIC_REPO }}
          LOGIN: ${{ secrets.GITFLIC_LOGIN }}
          TOKEN: ${{ secrets.GITFLIC_TOKEN }}
        run: |
          git fetch --tags --force origin
          remote="https://${LOGIN}:${TOKEN}@gitflic.ru/project/${REPO}.git"
          git push --force "$remote" refs/remotes/origin/main:refs/heads/main
          git push --force "$remote" --tags
      # Создание релиза через API GitFlic отвечает 403 даже токену со всеми правами на проект —
      # вопрос задан GitFlic; до ответа сбой шага не валит зеркало
      - name: Опубликовать выпуск на GitFlic
        if: env.SKIP != '1'
        continue-on-error: true
        env:
          REPO: ${{ vars.GITFLIC_REPO }}
          TOKEN: ${{ secrets.GITFLIC_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REBUILT: ${{ github.event_name == 'workflow_run' }}
        run: |
          api="https://api.gitflic.ru/project/${REPO}"
          auth="Authorization: token ${TOKEN}"
          # Запрос к API GitFlic: ответ — в response.json, при коде не 2xx процесс падает
          call() {
            what="$1"; shift
            code="$(curl -sS -o response.json -w '%{http_code}' -H "$auth" "$@")"
            if [ "${code#2}" = "$code" ]; then
              echo "${what}: ответ ${code}"; cat response.json; echo
              if [ "$code" = 403 ]; then
                echo "GitFlic отказал в доступе. Токену нужны права project_read и project_edit;" \
                  "если они есть, отказ — на стороне GitFlic"
              fi
              exit 1
            fi
          }

          git checkout --quiet refs/remotes/origin/main
          version="$(sed -n 's/^Версия: //p' ВебЧат/Проект.yaml)"
          tag="v${version}"
          archive="webchat-${version}.xlib"
          if ! gh release view "$tag" > /dev/null 2>&1; then
            echo "На GitHub нет выпуска ${tag} — на GitFlic публиковать нечего"; exit 0
          fi
          gh release download "$tag" --pattern "$archive" --dir dist --clobber

          # Релиз адресуется по UUID — ищется в списке по метке
          code="$(curl -sS -o response.json -w '%{http_code}' -H "$auth" "${api}/release?page=0&size=100")"
          if [ "$code" = 404 ]; then
            echo '[]' > response.json
          elif [ "${code#2}" = "$code" ]; then
            call "Список релизов не прочитан" "${api}/release?page=0&size=100"
          fi
          jq --arg t "$tag" 'first(.. | objects | select(.tagName? == $t)) // empty' response.json > release.json
          if [ ! -s release.json ]; then
            # Диагностика: дошла ли метка до GitFlic (на ход публикации не влияет)
            code="$(curl -sS -o tags.json -w '%{http_code}' -H "$auth" "${api}/tag?page=0&size=100")"
            if [ "${code#2}" != "$code" ]; then
              if jq -e --arg t "$tag" 'any(.. | strings; . == $t)' tags.json > /dev/null; then
                echo "Метка ${tag} на GitFlic есть"
              else
                echo "Метки ${tag} в списке меток GitFlic нет:"; jq -c '[.. | objects | .name? // empty]' tags.json
              fi
            else
              echo "Список меток GitFlic не прочитан, ответ ${code}:"; cat tags.json; echo
            fi
            notes="$(awk -v v="## ${version}" '$0 == v { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md)"
            notes="$(printf '%s\n\nЗагрузка: панель управления → Проекты → + Добавить проект → Загрузить проект из файла.' "$notes" | sed '/./,$!d')"
            jq -n --arg title "ВебЧат ${version}" --arg description "$notes" --arg tagName "$tag" \
              '{title: $title, description: $description, tagName: $tagName, preRelease: false, attachProjectArchive: false}' > body.json
            call "Релиз ${tag} не создан" -X POST -H 'Content-Type: application/json' --data @body.json "${api}/release"
            cp response.json release.json
            echo "Создан релиз ${tag}"
          fi
          id="$(jq -r '.id' release.json)"

          if jq -e --arg n "$archive" 'any(.attachmentFiles[]?; .name == $n)' release.json > /dev/null \
            && [ "$REBUILT" != true ]; then
            echo "Сборка ${archive} в релизе ${tag} уже есть"; exit 0
          fi
          # Прежние файлы релиза (старая сборка той же версии) удаляются перед загрузкой
          jq '[.attachmentFiles[]?.uuid]' release.json > old.json
          if [ "$(jq length old.json)" != 0 ]; then
            call "Старые файлы релиза не удалены" -X DELETE -H 'Content-Type: application/json' \
              --data @old.json "${api}/release/${id}/file"
          fi
          call "Сборка не загружена" -X POST -F "files=@dist/${archive}" "${api}/release/${id}/file"
          echo "Сборка ${archive} загружена в релиз ${tag}"
