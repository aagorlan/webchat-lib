# Выпуск: новая версия в ВебЧат/Проект.yaml на main — метка v<версия>, сборка .xlib
# и выпуск на странице Releases. У готового выпуска сборка перезаливается. Имя сборки латиницей:
# кириллицу из имён файлов выпуска GitHub вырезает
name: Выпуск

on:
  push:
    branches:
      - main
    paths:
      - 'ВебЧат/Проект.yaml'
      - '.github/workflows/release.yml'
      - '.github/упаковать.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать версию
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' ВебЧат/Проект.yaml)"
          if [ -z "$version" ]; then
            echo "В ВебЧат/Проект.yaml нет Version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "ARCHIVE=webchat-$version.xlib" >> "$GITHUB_ENV"
      - name: Собрать сборку
        run: |
          python3 .github/упаковать.py ВебЧат "dist/${ARCHIVE}" "$GITHUB_SHA"
      - name: Перезалить сборку готового выпуска
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "v${VERSION}" > /dev/null 2>&1; then
            gh release upload "v${VERSION}" "dist/${ARCHIVE}" --clobber
            gh release view "v${VERSION}" --json assets -q '.assets[].name' | grep -vxF "${ARCHIVE}" \
              | while read -r name; do gh release delete-asset -y -- "v${VERSION}" "$name"; done
            echo "EXISTS=1" >> "$GITHUB_ENV"
          fi
      - name: Опубликовать
        if: env.EXISTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "dist/${ARCHIVE}" \
            --target "$GITHUB_SHA" \
            --title "ВебЧат ${VERSION}" \
            --notes "Изменения — в CHANGELOG.md. Загрузка: панель управления → Проекты → + Добавить проект → Загрузить проект из файла."
