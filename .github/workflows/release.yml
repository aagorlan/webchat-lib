# Выпуск: новая версия в ВебЧат/Проект.yaml на main — метка v<версия>, zip-архив проекта
# и выпуск на странице Releases. Версия, у которой выпуск уже есть, пропускается
name: Выпуск

on:
  push:
    branches:
      - main
    paths:
      - 'ВебЧат/Проект.yaml'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Прочитать версию
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(sed -n 's/^Version: //p' ВебЧат/Проект.yaml)"
          if [ -z "$version" ]; then
            echo "В ВебЧат/Проект.yaml нет Version"; exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "Выпуск v$version уже есть"
            echo "EXISTS=1" >> "$GITHUB_ENV"
          fi
      - name: Собрать архив
        if: env.EXISTS != '1'
        run: |
          mkdir -p dist
          (cd ВебЧат && zip -qr "../dist/ВебЧат-${VERSION}.zip" .)
      - name: Опубликовать
        if: env.EXISTS != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}" "dist/ВебЧат-${VERSION}.zip" \
            --target "$GITHUB_SHA" \
            --title "ВебЧат ${VERSION}" \
            --notes "Изменения — в CHANGELOG.md. Загрузка: панель управления → Проекты → + Добавить проект → Загрузить проект из файла."
